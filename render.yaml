# Blueprint Render — vérifier Root Dir / Start sur le dashboard si le service existe déjà.
services:
  - type: web
    name: immopilot-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Connexion directe Neon (sans -pooler) pour migrate / scripts — obligatoire pour éviter P1002
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: DATABASE_URL
        sync: false
      # Instance unique Render : évite P1002 si un autre processus tient le verrou Prisma (10 s max côté CLI)
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false

  - type: web
    name: immopilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false